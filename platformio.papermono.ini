; Shared PaperMono development setup. Build with: pio run -e papermono
; Experiment E: 24 kHz filtered IMA ADPCM, 16 capture buffers, 300-second chunks.
; Session numbers are assigned from the first unused directory; verify them on SD.
; Machine-specific paths/ports belong in gitignored platformio.local.ini, loaded last.
; Release profiles in platformio.ini retain their existing recorder defaults.

[voice_memo]
format = ImaAdpcm4
sample_rate = 24000
filter_enabled = true
chunk_seconds = 300
block_samples = 1024
buffer_blocks = 16
read_timeout_ms = 100
no_audio_timeout_ms = 2000

; --- M5Stack Paper Mono — ESP32-S3, SSD1683 800x480 + FT6336 touch + frontlight
; Power/reset plumbing runs through the M5PM1 PMIC and M5IOE1 expander; the SDK
; sequences them itself. Touch, frontlight, RTC, and other capabilities are
; selected by the Paper Mono BoardConfig profile.
; Extends base (not firmware_tuned): USB Drive needs the prebuilt dio_opi
; Arduino variant, whose TinyUSB component is enabled for CDC and MSC.
;   pio run -e papermono -t upload
[env:papermono]
extends = base
lib_deps =
  ${base.lib_deps}
  Microphone=symlink://freeink-sdk/libs/hardware/Microphone
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PAPERMONO=1
  -DFREEINK_CAP_USB_MSC=1
  ; The SSD1683 grayscale target planes are batched in PSRAM.
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_Paper_Mono\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-papermono\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  ; Native 1-bit SDMMC is mounted through SdFat's block-device interface.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DVOICE_MEMO_FORMAT=${voice_memo.format}
  -DVOICE_MEMO_SAMPLE_RATE=${voice_memo.sample_rate}
  -DVOICE_MEMO_FILTER_ENABLED=${voice_memo.filter_enabled}
  -DVOICE_MEMO_CHUNK_SECONDS=${voice_memo.chunk_seconds}
  -DVOICE_MEMO_BLOCK_SAMPLES=${voice_memo.block_samples}
  -DVOICE_MEMO_BUFFER_BLOCKS=${voice_memo.buffer_blocks}
  -DVOICE_MEMO_READ_TIMEOUT_MS=${voice_memo.read_timeout_ms}
  -DVOICE_MEMO_NO_AUDIO_TIMEOUT_MS=${voice_memo.no_audio_timeout_ms}
